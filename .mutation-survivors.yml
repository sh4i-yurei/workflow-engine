# Equivalent mutants confirmed by a scoped local mutmut run.
- mutant: tools.openrig_backup.x_check_copy__mutmut_6
  reason: >-
    SQLite reads keywords and pragma names without regard to case, so
    "pragma integrity_check" runs the same check and returns the same rows.
- mutant: tools.openrig_backup.x_check_copy__mutmut_7
  reason: >-
    SQLite reads keywords and pragma names without regard to case, so
    "PRAGMA INTEGRITY_CHECK" runs the same check and returns the same rows.
- mutant: tools.openrig_backup.x_copy_database__mutmut_9
  reason: >-
    urllib.parse.quote already uses safe="/" by default, so dropping the
    argument builds the same URI for every path.
- mutant: tools.openrig_backup.x_copy_database__mutmut_11
  reason: >-
    quote never escapes letters, so adding X to the safe characters changes
    nothing; "/" stays safe and the URI is the same for every path.
- mutant: tools.openrig_backup.x_main__mutmut_53
