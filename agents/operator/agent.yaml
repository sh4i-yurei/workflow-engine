name: operator
version: "1.0"
description: "Operator, the one agent the user talks to: briefs, routes and tracks work (Workflow engine decision 49)"

defaults:
  runtime: claude-code

imports:
  - ref: path:/var/home/sh4i_yurei/.npm-global/lib/node_modules/@openrig/cli/daemon/specs/agents/shared

profiles:
  default:
    uses:
      skills: []
      guidance: []
      subagents: []
      plugins: [shared:openrig-core]
      runtime_resources: [shared:claude-activity-hooks]

resources:
  guidance:
    - id: role
      path: guidance/role.md
  # The role's own Claude settings (Work system decision 28). Declared but not selected in the
  # profile yet, so the seat doesn't load it until a later change wires it in.
  runtime_resources:
    - id: role-settings
      path: runtime/claude-settings.fragment.json
      runtime: claude-code
      type: claude_settings_fragment

startup:
  files:
    - path: guidance/role.md
      orientation: role
      delivery_hint: send_text
      required: true
  actions: []
