version: "0.2"
name: hq
summary: Operator, the lead the user talks to
managed_blocks:
  claude-code: CLAUDE.local.md
# Claude seats run in auto mode (OpenRig team note, decided 2026-11-20). Existing seats also got
# `rig seat set-permissions <seat> --mode auto`, which overrides this line from then on. To change
# the policy later, edit this line AND run `rig seat set-permissions <seat> --mode inherit` (or set
# the new mode) on every existing seat, or the old choice stays.
permission_policy: builtin:auto
# Every Claude seat denies the question tool and plan mode (decided 2026-11-20). Each opens a
# dialog nobody watches, and OpenRig won't type into one, so queued work sticks behind it. Existing
# seats got the same list with `rig seat set-permissions <seat> --rules <file>`, which REPLACES a
# seat's recorded rules: read `rig seat status` before changing them.
# Every Claude seat also denies the claude.ai productivity connectors (Workflow engine decision 40,
# 2026-11-24): Gmail, Google Calendar, Indeed, Notion and Claude Docs, and Google Drive everywhere
# but Operator. They belong to a secretary role, which leaves them out. A deny rule hides the tools
# but doesn't stop the connector: it still connects, and its server instructions still load.

pods:
  - id: main
    label: HQ
    members:
      - id: lead
        label: Operator
        agent_ref: "local:../agents/operator"
        runtime: claude-code
        profile: default
        env:
          AGENT_NAME: operator
        # The lead keeps the question tool: the user watches this terminal, so asking in a dialog is
        # right here (decided 2026-11-20). Plan mode stays denied.
        claude_permissions:
          deny:
            - EnterPlanMode
            - ExitPlanMode
            - mcp__claude_ai_Gmail
            - mcp__claude_ai_Google_Calendar
            - mcp__claude_ai_Indeed
            - mcp__claude_ai_Notion
            - mcp__claude_ai_Claude_Docs
        cwd: "/var/home/sh4i_yurei/.openrig/workspace/hq/main"
