version: "0.2"
name: workflow-engine
summary: Project owners for the workflow-engine team
managed_blocks:
  claude-code: CLAUDE.local.md
# Claude seats run in auto mode (OpenRig team note, decided 2026-11-20). Existing seats also got
# `rig seat set-permissions <seat> --mode auto`, which overrides this line from then on. To change
# the policy later, edit this line AND run `rig seat set-permissions <seat> --mode inherit` (or set
# the new mode) on every existing seat, or the old choice stays.
permission_policy: builtin:auto
# Every Claude seat denies the question tool and plan mode (decided 2026-11-20). Each opens a
# dialog nobody watches, and OpenRig won't type into one, so queued work sticks behind it. Existing
# seats got the same list with `rig seat set-permissions <seat> --rules <file>`, which REPLACES a
# seat's recorded rules: read `rig seat status` before changing them.
# Every Claude seat also denies the claude.ai productivity connectors (Workflow engine decision 40,
# 2026-11-24): Gmail, Google Calendar, Indeed, Notion and Claude Docs, and Google Drive everywhere
# but Operator. They belong to a secretary role, which leaves them out. A deny rule hides the tools
# but doesn't stop the connector: it still connects, and its server instructions still load.
# Every Claude seat denies the Agent and Workflow tools (decided 2026-11-25), so research and review
# run as labelled jobs in panes and never as hidden agents. Each owner seat also denies Edit on code
# under ~/Documents (.py, .sh, .js, .ts, .go, .rs), on GitHub workflow files and on ~/.claude/hooks,
# because Codex writes code. Operator instead denies Edit on the vault's project, buildlog, agent,
# post, reference and manual folders and on ~/Documents/worktrees. Edit rules cover every built-in
# file tool and the Bash file commands Claude Code recognises; paths are ~/-anchored, because a
# /path rule resolves against the settings file's folder.
# Every Claude seat also denies edits to the files that set its own permissions and guidance, and
# the command that records seat rules (decided 2026-11-25). One seat keeps each:
# - ~/.claude/settings.json and settings.local.json: the token baseline seat.
# - the team files and agent specs in ~/Documents/workflow-engine, ~/.openrig/*.json and each
#   seat's .claude folder under ~/.openrig/workspace: the OpenRig team seat. The workflow engine
#   seat also keeps the team files and agent specs, because it edits the role files there.
# - ~/.claude/CLAUDE.md: the workflow upkeep rules seat.
# - rig seat set-permissions: the OpenRig team seat, which applies merged team files to seats.

pods:
  - id: workflow-engine
    label: Workflow engine
    members:
      - id: owner
        agent_ref: "local:../agents/owner"
        runtime: claude-code
        profile: default
        env:
          AGENT_NAME: workflow-engine
        claude_permissions:
          deny:
            - AskUserQuestion
            - EnterPlanMode
            - ExitPlanMode
            - mcp__claude_ai_Gmail
            - mcp__claude_ai_Google_Calendar
            - mcp__claude_ai_Indeed
            - mcp__claude_ai_Notion
            - mcp__claude_ai_Claude_Docs
            - mcp__claude_ai_Google_Drive
            - Agent
            - Workflow
            - "Edit(~/Documents/**/*.py)"
            - "Edit(~/Documents/**/*.sh)"
            - "Edit(~/Documents/**/*.js)"
            - "Edit(~/Documents/**/*.ts)"
            - "Edit(~/Documents/**/*.go)"
            - "Edit(~/Documents/**/*.rs)"
            - "Edit(~/Documents/**/.github/workflows/**)"
            - "Edit(~/.claude/hooks/**)"
            - "Edit(~/.claude/settings.json)"
            - "Edit(~/.claude/settings.local.json)"
            - "Edit(~/.openrig/*.json)"
            - "Edit(~/.openrig/workspace/**/.claude/**)"
            - "Edit(~/.claude/CLAUDE.md)"
            - "Bash(rig seat set-permissions *)"
        cwd: "/var/home/sh4i_yurei/.openrig/workspace/workflow-engine/workflow-engine"
        startup:
          files:
            - path: startup/workflow-engine.md
              delivery_hint: send_text
              required: true
