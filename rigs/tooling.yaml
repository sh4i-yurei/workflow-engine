version: "0.2"
name: tooling
summary: Project owners for the tooling team
managed_blocks:
  claude-code: CLAUDE.local.md
# Claude seats run in auto mode (OpenRig team note, decided 2026-11-20). Existing seats also got
# `rig seat set-permissions <seat> --mode auto`, which overrides this line from then on. To change
# the policy later, edit this line AND run `rig seat set-permissions <seat> --mode inherit` (or set
# the new mode) on every existing seat, or the old choice stays.
permission_policy: builtin:auto
# Every Claude seat denies the question tool and plan mode (decided 2026-11-20). Each opens a
# dialog nobody watches, and OpenRig won't type into one, so queued work sticks behind it. Existing
# seats got the same list with `rig seat set-permissions <seat> --rules <file>`, which REPLACES a
# seat's recorded rules: read `rig seat status` before changing them.
# Every Claude seat also denies the claude.ai productivity connectors (Workflow engine decision 40,
# 2026-11-24): Gmail, Google Calendar, Indeed, Notion and Claude Docs, and Google Drive everywhere
# but Operator. They belong to a secretary role, which leaves them out. A deny rule hides the tools
# but doesn't stop the connector: it still connects, and its server instructions still load.

pods:
  - id: workflow-upkeep
    label: Workflow upkeep
    members:
      # Two seats, one per workstream (Workflow engine decision 28). The CI seat keeps the member id
      # `owner` because it existed before the split; changing a member id makes a new seat.
      - id: owner
        label: CI
        agent_ref: "local:../agents/owner"
        runtime: claude-code
        profile: default
        env:
          AGENT_NAME: workflow-upkeep-ci
        # The CI seat may set up CI on the sh4i-yurei repositories: create or update a ruleset, and
        # set branch protection or its required status checks (decided 2026-11-22). Auto mode lets a
        # specific allow rule skip its classifier, but it suspends rules that could run arbitrary
        # code, so the same scope is also given to the classifier in prose below. Neither covers
        # deleting a ruleset or protection, or any other repository setting.
        claude_permissions:
          allow:
            - "Bash(vault-run --env GH_TOKEN -- gh api --method POST repos/sh4i-yurei/*/rulesets*)"
            - "Bash(vault-run --env GH_TOKEN -- gh api --method PUT repos/sh4i-yurei/*/rulesets/*)"
            - "Bash(vault-run --env GH_TOKEN -- gh api --method PUT repos/sh4i-yurei/*/branches/*/protection*)"
            - "Bash(vault-run --env GH_TOKEN -- gh api --method PATCH repos/sh4i-yurei/*/branches/*/protection/required_status_checks*)"
          deny:
            - AskUserQuestion
            - EnterPlanMode
            - ExitPlanMode
            - mcp__claude_ai_Gmail
            - mcp__claude_ai_Google_Calendar
            - mcp__claude_ai_Indeed
            - mcp__claude_ai_Notion
            - mcp__claude_ai_Claude_Docs
            - mcp__claude_ai_Google_Drive
        claude_auto_mode:
          allow:
            - "$defaults"
            - "Setting up CI on the user's own GitHub repositories under the owner sh4i-yurei: creating a repository ruleset or updating an existing one (for example adding a required status check such as python / checks to the main branch's ruleset), and setting branch protection or its required status checks, through vault-run --env GH_TOKEN -- gh api with --method POST, PUT or PATCH. The user decided on 2026-11-22 that this seat sets up CI. It never covers deleting a ruleset or branch protection, removing or weakening an existing rule, changing repository visibility, collaborators, secrets or webhooks, or any repository outside sh4i-yurei."
        cwd: "/var/home/sh4i_yurei/.openrig/workspace/tooling/workflow-upkeep"
        startup:
          files:
            - path: startup/workflow-upkeep.md
              delivery_hint: send_text
              required: true
      - id: rules
        label: Workflow rules
        agent_ref: "local:../agents/owner"
        runtime: claude-code
        profile: default
        env:
          AGENT_NAME: workflow-upkeep-rules
        claude_permissions:
          deny:
            - AskUserQuestion
            - EnterPlanMode
            - ExitPlanMode
            - mcp__claude_ai_Gmail
            - mcp__claude_ai_Google_Calendar
            - mcp__claude_ai_Indeed
            - mcp__claude_ai_Notion
            - mcp__claude_ai_Claude_Docs
            - mcp__claude_ai_Google_Drive
        cwd: "/var/home/sh4i_yurei/.openrig/workspace/tooling/workflow-upkeep-rules"
        startup:
          files:
            - path: startup/workflow-upkeep-rules.md
              delivery_hint: send_text
              required: true
